# Layered destination config: module's own .env (git-ignored, standalone
# defaults) is overridden by the monorepo root .env (same key names), which
# is overridden by real process environment variables. Later import wins.
# MASTER_ENV_FILE lets a module find the root file from anywhere; if neither
# file exists, Spring just falls through to the ${KEY:default} values below.
spring.config.import=optional:file:./.env[.properties],optional:file:${MASTER_ENV_FILE:../.env}[.properties]

# Server Configuration
server.port=${LEXICON_PORT:36568}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Enable storage profile for 500GB volume
spring.profiles.include=storage

# CORS Configuration
# Exact origins (comma-separated) and wildcard origin patterns (Spring's
# setAllowedOriginPatterns * syntax) are kept separate; LexiconSecurityConfig
# additionally derives http://LAN_HOST:* and http://PLAYIT_HOST:* patterns
# automatically when those keys are set - see the root .env.example.
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://alex-dyakin.com}
cors.allowed.origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.alex-dyakin.com,http://*.playit.pub:*,http://*.with.playit.plus:*,http://*.gl.at.ply.gg:*,http://localhost:*,capacitor://localhost,https://localhost}
cors.lan-host=${LAN_HOST:}
cors.playit-host=${PLAYIT_HOST:}

# Database Configuration
# Use same database as Alchemy for unified users. DATABASE_URL is read
# directly (not through a Spring property) by lexicon.utils.DatabaseConfig,
# which the ~13 HSQL*Database classes and DatabaseInitializer use, because
# those classes open JDBC connections before/outside Spring DI. It still
# honors this same layered .env / env-var chain - see
# lexicon.config.DatabaseUrlEnvironmentPostProcessor.

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000

# File upload configuration
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:2GB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:2GB}

# Timeout configuration for large file uploads (in milliseconds)
# 30 minutes for connection and read timeout
server.tomcat.connection-timeout=1800000
spring.mvc.async.request-timeout=1800000

# Session cookie settings
# SameSite=Lax avoids the "SameSite=None without Secure" rejection over HTTP PlayIt tunnels.
# Browser clients are same-site with the API, so Lax is sufficient; the Android app
# does not use this cookie at all (it sends an Authorization: Bearer token instead).
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# File storage path
lexicon.file.upload-dir=${UPLOAD_DIR:./uploads}

# yt-dlp configuration
ytdlp.cookies.path=${YTDLP_COOKIES_PATH:cookies.txt}

# VAPID keys for Web Push notifications
# Generate with: npx web-push generate-vapid-keys --json
# NEVER commit real keys here — set via environment variables only
vapid.public.key=${VAPID_PUBLIC_KEY}
vapid.private.key=${VAPID_PRIVATE_KEY}
vapid.subject=${VAPID_SUBJECT:mailto:admin@alex-dyakin.com}

# Android sideload updater metadata
app.update.version-code=${APP_UPDATE_VERSION_CODE:1}
app.update.version-name=${APP_UPDATE_VERSION_NAME:0.1.0}
app.update.download-url=${APP_UPDATE_DOWNLOAD_URL:${PUBLIC_LEXICON_URL:https://api.alex-dyakin.com}/api/app/download/latest}
app.update.apk-path=${APP_UPDATE_APK_PATH:./releases/lexicon-latest.apk}
app.update.critical=${APP_UPDATE_CRITICAL:false}
app.update.changelog=${APP_UPDATE_CHANGELOG:}
app.update.sha256=${APP_UPDATE_SHA256:}
app.update.public-metadata=${APP_UPDATE_PUBLIC_METADATA:false}
app.update.public-download=${APP_UPDATE_PUBLIC_DOWNLOAD:false}
# ── Lexi (voice edge) ────────────────────────────────────────────────────────
# Lexi runs on this machine bound to localhost; the browser reaches it only
# through /api/voice, which reuses this server's TLS and session cookie.
# LEXI_TOOL_TOKEN must match Lexi's own .tool_token (or its $LEXI_TOOL_TOKEN).
lexi.base.url=${LEXI_BASE_URL:http://127.0.0.1:${LEXI_PORT:8765}}
lexi.tool.token=${LEXI_TOOL_TOKEN:}

# ── Mumble Bridge (voice.alex-dyakin.com) ───────────────────────────────────
# AvatarProxyController forwards avatar requests to the bridge.
bridge.base-url=${PUBLIC_BRIDGE_URL:https://voice.alex-dyakin.com}
