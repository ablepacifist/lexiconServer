# Server Configuration
server.port=${LEXICON_PORT:36568}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Enable storage profile for 500GB volume
spring.profiles.include=storage

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://alex-dyakin.com,https://api.alex-dyakin.com,https://alchemy.alex-dyakin.com,http://209.25.140.16:1796,http://209.25.140.16:1760,http://209.25.140.16:1792,http://possibilities-flaw.with.playit.plus:1796,http://possibilities-bmc.with.playit.plus:1760,http://possibilities-alvin.with.playit.plus:1792}

# Database Configuration
# Use same database as Alchemy for unified users
database.url=${DATABASE_URL:jdbc:hsqldb:hsql://localhost:9002/mydb}

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000

# File upload configuration
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:2GB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:2GB}

# Timeout configuration for large file uploads (in milliseconds)
# 30 minutes for connection and read timeout
server.tomcat.connection-timeout=1800000
spring.mvc.async.request-timeout=1800000

# Session cookie settings
# SameSite=Lax avoids the "SameSite=None without Secure" rejection over HTTP PlayIt tunnels.
# Browser clients are same-site with the API, so Lax is sufficient; the Android app
# does not use this cookie at all (it sends an Authorization: Bearer token instead).
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# File storage path
lexicon.file.upload-dir=${UPLOAD_DIR:./uploads}

# yt-dlp configuration
ytdlp.cookies.path=${YTDLP_COOKIES_PATH:cookies.txt}

# VAPID keys for Web Push notifications
# Generate with: npx web-push generate-vapid-keys --json
# NEVER commit real keys here — set via environment variables only
vapid.public.key=${VAPID_PUBLIC_KEY}
vapid.private.key=${VAPID_PRIVATE_KEY}
vapid.subject=${VAPID_SUBJECT:mailto:admin@alex-dyakin.com}

# Android sideload updater metadata
app.update.version-code=${APP_UPDATE_VERSION_CODE:1}
app.update.version-name=${APP_UPDATE_VERSION_NAME:0.1.0}
app.update.download-url=${APP_UPDATE_DOWNLOAD_URL:https://api.alex-dyakin.com/api/app/download/latest}
app.update.apk-path=${APP_UPDATE_APK_PATH:./releases/lexicon-latest.apk}
app.update.critical=${APP_UPDATE_CRITICAL:false}
app.update.changelog=${APP_UPDATE_CHANGELOG:}
app.update.sha256=${APP_UPDATE_SHA256:}
app.update.public-metadata=${APP_UPDATE_PUBLIC_METADATA:false}
app.update.public-download=${APP_UPDATE_PUBLIC_DOWNLOAD:false}